<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Donna — Decisions</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4F1EA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14201E" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon.svg">
<style>
  :root{
    --paper:#F4F1EA;--card:#FBF9F4;--ink:#1E2B2B;--ink-soft:#46524E;--ink-faint:#7E877F;
    --line:#E1DBCE;--brass:#9C7A3C;--brass-deep:#7E6026;--urgent:#B24A38;--good:#3F7C5F;
    --shadow:0 1px 2px rgba(30,43,43,.05),0 12px 34px rgba(30,43,43,.08);
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme:dark){:root{
    --paper:#14201E;--card:#1B2725;--ink:#ECE7DB;--ink-soft:#B4BCB3;--ink-faint:#7C877E;
    --line:#2C3A37;--brass:#C9A45E;--brass-deep:#E0BE7A;--urgent:#D9705C;--good:#6BB08C;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 14px 40px rgba(0,0,0,.4);
  }}
  :root[data-theme="light"]{--paper:#F4F1EA;--card:#FBF9F4;--ink:#1E2B2B;--ink-soft:#46524E;--ink-faint:#7E877F;--line:#E1DBCE;--brass:#9C7A3C;--brass-deep:#7E6026;--urgent:#B24A38;--good:#3F7C5F;}
  :root[data-theme="dark"]{--paper:#14201E;--card:#1B2725;--ink:#ECE7DB;--ink-soft:#B4BCB3;--ink-faint:#7C877E;--line:#2C3A37;--brass:#C9A45E;--brass-deep:#E0BE7A;--urgent:#D9705C;--good:#6BB08C;}
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);line-height:1.5;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:560px;margin:0 auto;padding:34px 22px calc(40px + env(safe-area-inset-bottom));min-height:100vh;display:flex;flex-direction:column;}
  .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px;}
  .brand{display:flex;align-items:center;gap:10px;}
  .brand .mark{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--brass);color:var(--paper);font-family:var(--serif);font-weight:700;font-size:17px;}
  .brand .name{font-family:var(--serif);font-size:19px;font-weight:600;}
  .theme-btn{border:1px solid var(--line);background:transparent;color:var(--ink-faint);border-radius:999px;padding:5px 12px;font-size:12px;cursor:pointer;font-family:var(--sans);}
  .headline{font-family:var(--serif);font-size:26px;line-height:1.2;margin:0 0 6px;text-wrap:balance;}
  .sub{color:var(--ink-soft);font-size:14.5px;margin:0 0 18px;}
  .sub b{color:var(--ink);}
  .batch{width:100%;border:1px dashed var(--brass);background:color-mix(in srgb,var(--brass) 8%,transparent);color:var(--brass-deep);border-radius:12px;padding:12px;font-size:13.5px;font-weight:600;cursor:pointer;font-family:var(--sans);margin-bottom:22px;}
  .progress{display:flex;gap:6px;justify-content:center;margin-bottom:14px;flex-wrap:wrap;}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--line);transition:background .2s;}
  .dot.on{background:var(--brass);} .dot.done{background:var(--good);}
  .deck{flex:1;display:flex;align-items:flex-start;}
  .card{width:100%;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px 22px 22px;box-shadow:var(--shadow);position:relative;overflow:hidden;transition:opacity .2s,transform .2s;}
  .card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--brass);}
  .card.urgent::before,.card.high::before{background:var(--urgent);}
  .meta{display:flex;align-items:center;gap:9px;margin-bottom:14px;flex-wrap:wrap;}
  .chip{font-size:11px;font-weight:600;padding:3px 9px;border-radius:999px;}
  .chip.pri{background:color-mix(in srgb,var(--urgent) 15%,transparent);color:var(--urgent);}
  .chip.src{background:color-mix(in srgb,var(--brass) 15%,transparent);color:var(--brass-deep);}
  .who{font-weight:600;font-size:15px;} .when{font-family:var(--mono);font-size:11.5px;color:var(--ink-faint);margin-left:auto;}
  .subject{font-family:var(--serif);font-size:20px;line-height:1.25;margin:0 0 18px;text-wrap:balance;}
  .line{margin:0 0 14px;}
  .line .k{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-faint);font-weight:700;display:block;margin-bottom:3px;}
  .line .v{font-size:15px;line-height:1.4;}
  .line.act .v{font-family:var(--serif);color:var(--brass-deep);}
  .reply{background:color-mix(in srgb,var(--brass) 8%,transparent);border:1px solid color-mix(in srgb,var(--brass) 24%,transparent);border-radius:12px;padding:12px 13px;margin:0 0 14px;}
  .reply .tag{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--brass-deep);font-weight:700;display:block;margin-bottom:7px;}
  .reply textarea{width:100%;border:none;background:transparent;color:var(--ink);font-family:var(--serif);font-size:15px;line-height:1.5;resize:none;outline:none;overflow:hidden;min-height:96px;padding:0;}
  .details{font-size:12.5px;color:var(--ink-faint);background:none;border:none;cursor:pointer;padding:0 0 4px;font-family:var(--sans);text-decoration:underline;text-underline-offset:3px;}
  .full{display:none;margin:6px 0 4px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--paper);font-size:13px;color:var(--ink-soft);white-space:pre-wrap;line-height:1.5;}
  .full.show{display:block;}
  .full .lbl{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--brass-deep);font-weight:700;display:block;margin:10px 0 4px;}
  .full textarea{width:100%;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font-family:var(--serif);font-size:13.5px;padding:8px;resize:vertical;min-height:80px;}
  .hint{text-align:center;font-size:11.5px;color:var(--ink-faint);margin-top:12px;letter-spacing:.03em;user-select:none;}
  .card{cursor:grab;} .card:active{cursor:grabbing;}
  .actions{display:flex;gap:9px;margin-top:20px;}
  .btn{border:none;border-radius:11px;padding:13px 16px;font-size:14px;font-weight:600;cursor:pointer;font-family:var(--sans);flex:1;transition:filter .15s;}
  .btn:active{transform:translateY(1px);}
  .btn.primary{background:var(--ink);color:var(--paper);flex:2;} .btn.primary:hover{filter:brightness(1.12);}
  .btn.ghost{background:transparent;color:var(--ink-soft);border:1px solid var(--line);} .btn.ghost:hover{border-color:var(--ink-faint);color:var(--ink);}
  .done-screen{text-align:center;padding:56px 20px;display:none;}
  .done-screen.show{display:block;}
  .done-screen .big{font-family:var(--serif);font-size:46px;color:var(--good);margin-bottom:10px;}
  .done-screen h2{font-family:var(--serif);font-size:24px;margin:0 0 8px;}
  .done-screen p{color:var(--ink-soft);font-size:15px;margin:0;}
  .more{margin-top:26px;border-top:1px solid var(--line);padding-top:14px;}
  .more summary{list-style:none;cursor:pointer;color:var(--ink-faint);font-size:13px;text-align:center;}
  .more summary::-webkit-details-marker{display:none;}
  .more .body{padding:14px 2px 0;color:var(--ink-soft);font-size:13.5px;display:flex;flex-direction:column;gap:10px;}
  .more .row{display:flex;justify-content:space-between;gap:12px;border-bottom:1px dashed var(--line);padding-bottom:9px;}
  .more .row:last-child{border-bottom:none;}
  .more .row .r{color:var(--ink-faint);text-align:right;}
  .cmd{margin-top:22px;}
  .cmd .reply{font-size:13px;color:var(--ink-soft);margin-bottom:9px;font-family:var(--serif);}
  .cmd .field{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 10px 10px 15px;}
  .cmd input{flex:1;border:none;background:transparent;color:var(--ink);font-size:14px;font-family:var(--sans);outline:none;}
  .cmd .send{background:var(--brass);color:var(--paper);border:none;width:32px;height:32px;border-radius:9px;cursor:pointer;}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand"><div class="mark">D</div><div class="name">Donna</div></div>
    <button class="theme-btn" id="theme">◑ Theme</button>
  </div>

  <div id="live">
    <h1 class="headline" id="greet">…</h1>
    <p class="sub" id="sub"></p>
    <button class="batch" id="batch" hidden></button>
    <div class="progress" id="progress"></div>
    <div class="deck"><div id="cardslot"></div></div>
  </div>

  <div class="done-screen" id="doneScreen">
    <div class="big">✓</div>
    <h2>You're clear.</h2>
    <p>Nothing else needs you. I'll ping only if something urgent lands.</p>
  </div>

  <details class="more" id="more">
    <summary>Everything else — VIPs, follow-ups, calendar, to-dos</summary>
    <div class="body" id="moreBody"></div>
  </details>

  <div class="cmd">
    <div class="reply" id="reply"></div>
    <div class="field">
      <input id="cmd" placeholder="Ask Donna anything…" aria-label="Ask Donna">
      <button class="send" id="send" aria-label="Send">↑</button>
    </div>
  </div>
</div>
<script src="/app.js"></script>
</body>
</html>
