<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Donna — Today</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4F1EA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14201E" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon.svg">
<style>
  :root {
    --paper:#F4F1EA; --card:#FBF9F4; --ink:#1E2B2B; --ink-soft:#46524E;
    --ink-faint:#7E877F; --line:#E1DBCE; --brass:#9C7A3C; --brass-deep:#7E6026;
    --urgent:#B24A38; --good:#3F7C5F;
    --shadow:0 1px 2px rgba(30,43,43,.05),0 8px 24px rgba(30,43,43,.06);
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme:dark){:root{
    --paper:#14201E; --card:#1B2725; --ink:#ECE7DB; --ink-soft:#B4BCB3;
    --ink-faint:#7C877E; --line:#2C3A37; --brass:#C9A45E; --brass-deep:#E0BE7A;
    --urgent:#D9705C; --good:#6BB08C;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35);
  }}
  :root[data-theme="light"]{--paper:#F4F1EA;--card:#FBF9F4;--ink:#1E2B2B;--ink-soft:#46524E;--ink-faint:#7E877F;--line:#E1DBCE;--brass:#9C7A3C;--brass-deep:#7E6026;--urgent:#B24A38;--good:#3F7C5F;--shadow:0 1px 2px rgba(30,43,43,.05),0 8px 24px rgba(30,43,43,.06);}
  :root[data-theme="dark"]{--paper:#14201E;--card:#1B2725;--ink:#ECE7DB;--ink-soft:#B4BCB3;--ink-faint:#7C877E;--line:#2C3A37;--brass:#C9A45E;--brass-deep:#E0BE7A;--urgent:#D9705C;--good:#6BB08C;--shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35);}
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);line-height:1.5;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:680px;margin:0 auto;padding:40px 22px calc(150px + env(safe-area-inset-bottom));}
  .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:36px;}
  .brand{display:flex;align-items:center;gap:10px;}
  .brand .mark{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--brass);color:var(--paper);font-family:var(--serif);font-weight:700;font-size:17px;}
  .brand .name{font-family:var(--serif);font-size:19px;font-weight:600;}
  .clock{font-family:var(--mono);font-size:12.5px;color:var(--ink-faint);}
  .theme-btn{border:1px solid var(--line);background:transparent;color:var(--ink-faint);border-radius:999px;padding:5px 12px;font-size:12px;cursor:pointer;font-family:var(--sans);}
  .greet{font-family:var(--serif);font-size:34px;line-height:1.15;letter-spacing:-.01em;text-wrap:balance;margin:0 0 14px;}
  .thesis{font-family:var(--serif);font-size:19px;color:var(--ink-soft);max-width:34ch;margin:0;}
  .thesis b{color:var(--ink);font-weight:600;} .thesis .num{color:var(--brass-deep);font-weight:700;font-variant-numeric:tabular-nums;}
  .label{display:flex;align-items:center;gap:12px;margin:44px 0 16px;}
  .label span{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint);font-weight:600;}
  .label .rule{flex:1;height:1px;background:var(--line);}
  .label .count{font-family:var(--mono);font-size:11.5px;color:var(--ink-faint);}
  .stack{display:flex;flex-direction:column;gap:14px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 18px 16px;box-shadow:var(--shadow);position:relative;overflow:hidden;transition:opacity .18s,transform .18s;}
  .card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--brass);}
  .card.urgent::before,.card.high::before{background:var(--urgent);}
  .card .meta{display:flex;align-items:center;gap:9px;margin-bottom:9px;flex-wrap:wrap;}
  .chip{font-size:11px;font-weight:600;padding:3px 9px;border-radius:999px;}
  .chip.src{background:color-mix(in srgb,var(--brass) 15%,transparent);color:var(--brass-deep);}
  .chip.pri{background:color-mix(in srgb,var(--urgent) 15%,transparent);color:var(--urgent);}
  .card .who{font-weight:600;font-size:14.5px;} .card .when{font-family:var(--mono);font-size:11.5px;color:var(--ink-faint);margin-left:auto;}
  .card h3{margin:2px 0 10px;font-size:16px;font-weight:600;line-height:1.3;}
  .incoming{border-left:2px solid var(--line);padding:1px 0 1px 12px;margin:0 0 13px;}
  .incoming .tag{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-faint);font-weight:700;display:block;margin-bottom:5px;}
  .incoming .msg{font-size:13.5px;color:var(--ink-soft);white-space:pre-wrap;margin:0;line-height:1.45;}
  .incoming .msg.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .incoming .more{background:none;border:none;color:var(--brass-deep);font-size:12px;font-weight:600;cursor:pointer;padding:5px 0 0;font-family:var(--sans);}
  .donna{background:color-mix(in srgb,var(--brass) 8%,transparent);border:1px solid color-mix(in srgb,var(--brass) 22%,transparent);border-radius:10px;padding:11px 13px;margin-bottom:13px;}
  .donna .tag{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--brass-deep);font-weight:700;display:block;margin-bottom:4px;}
  .donna p{margin:0;font-family:var(--serif);font-size:14.5px;line-height:1.45;}
  .donna textarea{width:100%;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);font-family:var(--serif);font-size:14.5px;padding:8px;resize:vertical;min-height:70px;}
  .actions{display:flex;gap:8px;flex-wrap:wrap;}
  .btn{border:none;border-radius:9px;padding:9px 15px;font-size:13px;font-weight:600;cursor:pointer;font-family:var(--sans);}
  .btn.primary{background:var(--ink);color:var(--paper);} .btn.ghost{background:transparent;color:var(--ink-soft);border:1px solid var(--line);}
  .stack .card{cursor:grab;} .stack .card:active{cursor:grabbing;}
  .hint{text-align:center;font-size:11px;color:var(--ink-faint);margin-top:12px;letter-spacing:.03em;user-select:none;}
  .people{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 6px;}
  .person{flex:none;width:96px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 8px 10px;text-align:center;}
  .person .av{width:38px;height:38px;border-radius:50%;margin:0 auto 7px;display:grid;place-items:center;font-family:var(--serif);font-size:16px;font-weight:600;color:var(--paper);background:var(--brass);}
  .person .nm{font-size:12.5px;font-weight:600;} .person .st{font-size:10.5px;color:var(--ink-faint);margin-top:3px;}
  .waiting,.timeline,.todos{display:flex;flex-direction:column;}
  .wrow{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px dashed var(--line);}
  .wrow .body{flex:1;min-width:0;} .wrow .body .p{font-size:14px;font-weight:600;} .wrow .body .s{font-size:12.5px;color:var(--ink-faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .age{font-family:var(--mono);font-size:11.5px;padding:3px 8px;border-radius:999px;background:color-mix(in srgb,var(--brass) 14%,transparent);color:var(--brass-deep);}
  .age.old{background:color-mix(in srgb,var(--urgent) 15%,transparent);color:var(--urgent);}
  .nudge{border:1px solid var(--line);background:transparent;color:var(--ink-soft);border-radius:8px;padding:6px 11px;font-size:12px;font-weight:600;cursor:pointer;font-family:var(--sans);}
  .slot{display:flex;gap:16px;padding:11px 4px;border-bottom:1px dashed var(--line);align-items:baseline;}
  .slot .t{font-family:var(--mono);font-size:12.5px;color:var(--ink-faint);width:64px;flex:none;}
  .todo{display:flex;align-items:flex-start;gap:12px;padding:11px 4px;border-bottom:1px dashed var(--line);}
  .todo .box{width:19px;height:19px;border:1.5px solid var(--ink-faint);border-radius:6px;flex:none;margin-top:1px;cursor:pointer;display:grid;place-items:center;color:transparent;font-size:12px;}
  .todo.done .box{background:var(--good);border-color:var(--good);color:var(--paper);} .todo.done .txt{color:var(--ink-faint);text-decoration:line-through;}
  .todo .txt{font-size:14px;} .todo .by{font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--brass-deep);font-weight:700;margin-left:8px;}
  .handled{border:1px solid var(--line);border-radius:12px;}
  .handled summary{list-style:none;cursor:pointer;padding:14px 16px;font-size:13.5px;color:var(--ink-soft);}
  .handled .body{padding:0 16px 14px 30px;display:flex;flex-direction:column;gap:9px;}
  .handled .body div{font-size:13px;color:var(--ink-faint);}
  .handled .body div::before{content:"✓ ";color:var(--good);font-weight:700;}
  .cmd{position:fixed;left:0;right:0;bottom:0;padding:14px 22px calc(20px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--paper) 62%,transparent);}
  .cmd .inner{max-width:680px;margin:0 auto;}
  .cmd .field{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 12px 11px 16px;box-shadow:var(--shadow);}
  .cmd .field input{flex:1;border:none;background:transparent;color:var(--ink);font-size:14.5px;font-family:var(--sans);outline:none;}
  .cmd .send{background:var(--brass);color:var(--paper);border:none;width:34px;height:34px;border-radius:9px;cursor:pointer;font-size:15px;}
  .cmd .reply{font-size:13px;color:var(--ink-soft);margin-bottom:9px;font-family:var(--serif);}
  .gone{opacity:0;transform:translateX(30px);pointer-events:none;height:0;padding:0;margin:0;border:0;}
  .empty{color:var(--ink-faint);font-size:14px;padding:8px 4px;}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;}}
  .nav{display:flex;gap:6px;margin:0 0 22px;}
  .nav button{flex:1;text-align:center;font-size:13.5px;font-weight:600;color:var(--ink-soft);padding:9px;border-radius:10px;border:1px solid var(--line);background:transparent;cursor:pointer;font-family:var(--sans);}
  .nav button.on{background:var(--ink);color:var(--paper);border-color:var(--ink);}
  .phead{font-family:var(--serif);font-size:15px;color:var(--ink-soft);margin:0 0 16px;}
  .phead .r{color:var(--urgent);font-weight:600;} .phead .a{color:var(--amber,#B07D2B);font-weight:600;}
  .proj{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:17px 17px 15px;box-shadow:var(--shadow);position:relative;overflow:hidden;}
  .proj::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--good);}
  .proj.needs_you::before{background:var(--urgent);} .proj.stalled::before{background:var(--amber,#B07D2B);}
  .prow{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:4px;}
  .pstatus{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;}
  .pstatus.needs_you{background:color-mix(in srgb,var(--urgent) 15%,transparent);color:var(--urgent);}
  .pstatus.on_track{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good);}
  .pstatus.stalled{background:color-mix(in srgb,var(--amber,#B07D2B) 18%,transparent);color:var(--amber,#B07D2B);}
  .pchip{font-size:11px;font-weight:600;padding:3px 8px;border-radius:999px;background:color-mix(in srgb,var(--brass) 14%,transparent);color:var(--brass-deep);font-family:var(--mono);}
  .pmenu{margin-left:auto;color:var(--ink-faint);font-size:18px;cursor:pointer;background:none;border:none;line-height:1;}
  .byd{font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--brass-deep);font-weight:700;}
  .pname{font-family:var(--serif);font-size:18px;font-weight:600;margin:2px 0 10px;line-height:1.25;}
  .pnext{background:color-mix(in srgb,var(--brass) 8%,transparent);border:1px solid color-mix(in srgb,var(--brass) 22%,transparent);border-radius:10px;padding:9px 12px;margin-bottom:12px;}
  .pnext .k{font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--brass-deep);font-weight:700;display:block;margin-bottom:2px;}
  .pnext .v{font-family:var(--serif);font-size:14.5px;}
  .powes{font-size:12.5px;color:var(--ink-soft);margin-bottom:12px;} .powes b{color:var(--ink);}
  .pfoot{display:flex;align-items:center;gap:10px;border-top:1px dashed var(--line);padding-top:10px;flex-wrap:wrap;}
  .pfoot .src{font-family:var(--mono);font-size:11.5px;color:var(--ink-faint);}
  .pfoot .badge{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:color-mix(in srgb,var(--urgent) 15%,transparent);color:var(--urgent);}
  .pfoot .when{font-family:var(--mono);font-size:11px;color:var(--ink-faint);margin-left:auto;}
  /* ── Stash ── */
  .paste{display:flex;gap:8px;margin:0 0 6px;}
  .paste input{flex:1;background:var(--card);border:1px solid var(--line);border-radius:11px;padding:11px 14px;color:var(--ink);font-size:14px;font-family:var(--sans);outline:none;}
  .paste input:focus{border-color:var(--brass);}
  .ask{background:var(--card);border:1px solid color-mix(in srgb,var(--brass) 40%,var(--line));border-radius:14px;padding:16px;box-shadow:var(--shadow);}
  .ask .q{font-family:var(--serif);font-size:16px;margin:0 0 4px;}
  .ask .src{font-family:var(--mono);font-size:11.5px;color:var(--ink-faint);word-break:break-all;margin-bottom:11px;}
  .ask .row{display:flex;gap:8px;margin-bottom:9px;}
  .ask .row input{flex:1;background:var(--paper);border:1px solid var(--line);border-radius:9px;padding:9px 12px;color:var(--ink);font-size:14px;font-family:var(--sans);outline:none;}
  .kinds{display:flex;gap:6px;flex-wrap:wrap;}
  .kbtn{border:1px solid var(--line);background:transparent;color:var(--ink-soft);border-radius:999px;padding:5px 12px;font-size:12px;font-weight:600;cursor:pointer;font-family:var(--sans);}
  .kbtn:hover{border-color:var(--brass);color:var(--brass-deep);}
  .split{background:color-mix(in srgb,var(--brass) 8%,transparent);border:1px solid color-mix(in srgb,var(--brass) 26%,transparent);border-radius:14px;padding:15px 16px;}
  .split .t{font-family:var(--serif);font-size:15.5px;margin-bottom:3px;}
  .split .t b{color:var(--brass-deep);}
  .split .r{font-size:12.5px;color:var(--ink-soft);margin-bottom:11px;}
  .topic{margin-bottom:22px;}
  .thead{display:flex;align-items:baseline;gap:9px;margin:0 0 7px;}
  .thead .n{font-family:var(--serif);font-size:16.5px;font-weight:600;}
  .thead .c{font-family:var(--mono);font-size:11px;color:var(--ink-faint);}
  .sub{margin:9px 0 0 14px;padding-left:12px;border-left:1px dashed var(--line);}
  .sub .n{font-size:13.5px;font-weight:600;color:var(--brass-deep);margin-bottom:3px;}
  .sitem{display:flex;align-items:flex-start;gap:10px;padding:9px 2px;border-bottom:1px dashed var(--line);}
  .sitem .plat{font-family:var(--mono);font-size:10px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-faint);border:1px solid var(--line);border-radius:5px;padding:1px 5px;flex:none;margin-top:3px;}
  .sitem .b{flex:1;min-width:0;}
  .sitem .h{font-size:14px;font-weight:600;line-height:1.3;}
  .sitem .h a{color:inherit;text-decoration:none;border-bottom:1px solid var(--line);}
  .sitem .d{font-size:12.5px;color:var(--ink-faint);line-height:1.4;margin-top:2px;}
  .sitem .acts{display:flex;gap:6px;margin-top:7px;}
  .mini{border:1px solid var(--line);background:transparent;color:var(--ink-soft);border-radius:7px;padding:4px 9px;font-size:11.5px;font-weight:600;cursor:pointer;font-family:var(--sans);}
  .mini:hover{border-color:var(--brass);color:var(--brass-deep);}
  .sitem .w{font-family:var(--mono);font-size:10.5px;color:var(--ink-faint);flex:none;}
  .kblurb{font-size:12.5px;color:var(--ink-faint);margin:-6px 0 14px;}
  @media (max-width:520px){.greet{font-size:28px;}.nav button{font-size:12.5px;padding:8px 4px;}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand"><div class="mark">D</div><div class="name">Donna</div></div>
    <div style="display:flex;align-items:center;gap:12px;">
      <span class="clock" id="clock"></span>
      <button class="theme-btn" id="theme">◑ Theme</button>
    </div>
  </div>
  <div class="nav">
    <button id="tabToday" class="on" onclick="switchView('today')">Today</button>
    <button id="tabProjects" onclick="switchView('projects')">Projects</button>
    <button id="tabStash" onclick="switchView('stash')">Stash</button>
  </div>
  <h1 class="greet" id="greet">…</h1>
  <p class="thesis" id="thesis"></p>
  <div id="sections"></div>
</div>

<div class="cmd">
  <div class="inner">
    <div class="reply" id="reply"></div>
    <div class="field">
      <input id="cmd" placeholder="Tell Donna what to do…" aria-label="Command Donna">
      <button class="send" id="send" aria-label="Send">↑</button>
    </div>
  </div>
</div>

<script src="/app.js"></script>
</body>
</html>
